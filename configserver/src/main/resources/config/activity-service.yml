spring:
  application:
    name: activity-service
  mongodb:
    uri: ${MONGODB_URI}
    database: fitnessactivities
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
server:
  port: ${PORT:8082}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking