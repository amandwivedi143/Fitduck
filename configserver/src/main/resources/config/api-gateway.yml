spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://userservice:8081
              predicates:
                - Path=/api/user/**

            - id: ai-service
              uri: http://ai-service:8083
              predicates:
                - Path=/api/recommendation/**

            - id: aihelper-service
              uri: http://aihelper:8084
              predicates:
                - Path=/api/mealplan/**

            - id: aihelper-workout-service
              uri: http://aihelper:8084
              predicates:
                - Path=/api/workoutplan/**

            - id: activity-service
              uri: http://activity-service:8082
              predicates:
                - Path=/api/activity/**

server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    hostname: localhost
    prefer-ip-address: true

# --- Google OAuth2 (token-exchange flow) ---
app:
  security:
    google-client-id: ${GOOGLE_CLIENT_ID}
    app-jwt-secret: ${APP_JWT_SECRET}
    app-jwt-issuer: fitness-gateway
    app-jwt-ttl-minutes: 60
    cookie-name: app_jwt
    public-paths: /api/auth/**,/actuator/**
