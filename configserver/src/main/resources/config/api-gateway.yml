spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/user/**

            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/recommendation/**

            - id: aihelper-service
              uri: ${AIHELPER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/mealplan/**

            - id: aihelper-workout-service
              uri: ${AIHELPER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/workoutplan/**

            - id: activity-service
              uri: ${ACTIVITY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/activity/**

server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true

# --- Google OAuth2 (token-exchange flow) ---
app:
  security:
    google-client-id: "775509038693-bshcj00biq64gdc5r09ilnk18serure0.apps.googleusercontent.com"
    app-jwt-secret: dev-only-super-secret-change-me-in-production-please-32chars
    app-jwt-issuer: fitness-gateway
    app-jwt-ttl-minutes: 60
    cookie-name: app_jwt
    public-paths: /api/auth/**,/actuator/**
    cookie-secure: false

services:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
