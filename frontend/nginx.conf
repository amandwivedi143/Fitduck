server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow Google Identity Services popup to communicate via postMessage
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Use Docker's embedded DNS resolver (127.0.0.11).
    # Forces nginx to resolve the upstream at request-time instead of
    # crashing at startup if the gateway isn't ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Forward /api to the gateway (same Docker network).
    # Using a variable in proxy_pass defers DNS resolution to request-time,
    # so nginx won't crash on boot if the gateway isn't resolvable yet.
    location /api/ {
        set $upstream_gateway http://gateway:8080;
        proxy_pass $upstream_gateway;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — give the gateway enough time for cold starts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        proxy_buffer_size 8k;
        proxy_buffers 4 16k;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
