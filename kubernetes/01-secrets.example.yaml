# Copy to secrets.yaml and fill values, OR create from .env:
#   kubectl create secret generic fittrack-secrets -n fittrack --from-env-file=../.env --dry-run=client -o yaml | kubectl apply -f -
#
# Required keys:
#   SPRING_DATASOURCE_URL, DB_USERNAME, DB_PASSWORD, MONGODB_URI,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, APP_JWT_SECRET, GEN_AI_KEY
apiVersion: v1
kind: Secret
metadata:
  name: fittrack-secrets
  namespace: fittrack
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:mysql://your-tidb-host:4000/fitness?sslMode=REQUIRED"
  DB_USERNAME: "your-username"
  DB_PASSWORD: "your-password"
  MONGODB_URI: "mongodb+srv://user:pass@cluster.mongodb.net/fitness_db"
  GOOGLE_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  APP_JWT_SECRET: "change-me-to-a-32-char-minimum-secret-key"
  GEN_AI_KEY: "your-groq-api-key"
