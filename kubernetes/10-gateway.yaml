apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fittrack
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: 2201920100047/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: CONFIG_HOST
              value: configserver
            - name: EUREKA_HOST
              value: eureka
            - name: USER_SERVICE_URL
              value: userservice
            - name: ACTIVITY_SERVICE_URL
              value: activity-service
            - name: AI_SERVICE_URL
              value: ai-service
            - name: AIHELPER_SERVICE_URL
              value: aihelper
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: fittrack-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fittrack-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fittrack-secrets
                  key: APP_JWT_SECRET
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx384m -XX:+UseSerialGC"
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: fittrack
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
