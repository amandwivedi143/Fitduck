# ============================================================
# Docker Compose — Fitness Web Microservices (Production)
# ============================================================
# Designed for single-VM deployment (Oracle Cloud, etc.)
# Databases are external: TiDB Cloud (MySQL) + MongoDB Atlas
# Only port 80 (nginx) is exposed to the internet.
#
#   docker compose up -d --build
# ============================================================

services:
  # ---------- Infrastructure ----------

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fitness-rabbitmq
    restart: unless-stopped
    # No port mapping — only accessible within Docker network
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------- Backend Services ----------

  eureka:
    build:
      context: ./eureka
      dockerfile: Dockerfile
    container_name: fitness-eureka
    restart: unless-stopped
    environment:
      - PORT=8761
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M

  configserver:
    build:
      context: ./configserver
      dockerfile: Dockerfile
    container_name: fitness-configserver
    restart: unless-stopped
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      - PORT=8888
      - SPRING_PROFILES_ACTIVE=native
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M

  userservice:
    build:
      context: ./userservice
      dockerfile: Dockerfile
    container_name: fitness-userservice
    restart: unless-stopped
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      - PORT=8081
      - CONFIG_SERVER_URL=http://configserver:8888
      - EUREKA_URL=http://eureka:8761/eureka/
      # TiDB Cloud (external MySQL-compatible)
      - MYSQL_URL=${SPRING_DATASOURCE_URL}
      - MYSQL_USERNAME=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M

  activity-service:
    build:
      context: ./activity-status
      dockerfile: Dockerfile
    container_name: fitness-activity-service
    restart: unless-stopped
    depends_on:
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=8082
      - CONFIG_SERVER_URL=http://configserver:8888
      - EUREKA_URL=http://eureka:8761/eureka/
      # MongoDB Atlas (external)
      - MONGODB_URI=${MONGODB_URI}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M

  ai-service:
    build:
      context: ./aiservice
      dockerfile: Dockerfile
    container_name: fitness-ai-service
    restart: unless-stopped
    depends_on:
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=8083
      - CONFIG_SERVER_URL=http://configserver:8888
      - EUREKA_URL=http://eureka:8761/eureka/
      # MongoDB Atlas (external)
      - MONGODB_URI=${MONGODB_URI}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - GROQ_API_KEY=${GEN_AI_KEY}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M

  aihelper:
    build:
      context: ./Aihelper
      dockerfile: Dockerfile
    container_name: fitness-aihelper-service
    restart: unless-stopped
    depends_on:
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=8084
      - CONFIG_SERVER_URL=http://configserver:8888
      - EUREKA_URL=http://eureka:8761/eureka/
      # MongoDB Atlas (external)
      - MONGODB_URI=${MONGODB_URI}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - GROQ_API_KEY=${GEN_AI_KEY}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: fitness-gateway
    restart: unless-stopped
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - PORT=8080
      - CONFIG_SERVER_URL=http://configserver:8888
      - EUREKA_URL=http://eureka:8761/eureka/
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------- Frontend (only service exposed to internet) ----------

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitness-frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      # ONLY exposed port — this is your public entry point
      - "80:80"
