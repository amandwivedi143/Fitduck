# ============================================================
# Docker Compose — Fitness Web Microservices (EC2 Free Tier)
# ============================================================
# Pre-built images — no build step needed.
#   docker compose up -d
# ============================================================

services:

  # 1. RabbitMQ (no dependencies)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fitness-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M

  # 2. Eureka (no dependencies)
  eureka:
    image: 2201920100047/eureka:latest
    container_name: fitness-eureka
    restart: unless-stopped
    environment:
      - PORT=8761
      - JAVA_OPTS=-Xms128m -Xmx180m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 200M

  # 3. Config Server (needs eureka)
  configserver:
    image: 2201920100047/configserver:latest
    container_name: fitness-configserver
    restart: unless-stopped
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      - PORT=8888
      - SPRING_PROFILES_ACTIVE=native
      - JAVA_OPTS=-Xms128m -Xmx180m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 200M

  # 4. User Service (needs configserver)
  userservice:
    image: 2201920100047/userservice:latest
    container_name: fitness-userservice
    restart: unless-stopped
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      - PORT=8081
      - CONFIG_HOST=configserver
      - EUREKA_HOST=eureka
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 280M

  # 5. Activity Service (needs configserver + rabbitmq)
  activity-service:
    image: 2201920100047/activity-status:latest
    container_name: fitness-activity-service
    restart: unless-stopped
    depends_on:
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=8082
      - CONFIG_HOST=configserver
      - EUREKA_HOST=eureka
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - JAVA_OPTS=-Xms128m -Xmx220m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 240M

  # 6. AI Service (needs configserver + rabbitmq)
  ai-service:
    image: 2201920100047/aiservice:latest
    container_name: fitness-ai-service
    restart: unless-stopped
    depends_on:
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=8083
      - CONFIG_HOST=configserver
      - EUREKA_HOST=eureka
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - JAVA_OPTS=-Xms128m -Xmx220m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 240M

  # 7. AI Helper Service (needs configserver + rabbitmq)
  aihelper:
    image: 2201920100047/aihelper:latest
    container_name: fitness-aihelper-service
    restart: unless-stopped
    depends_on:
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=8084
      - CONFIG_HOST=configserver
      - EUREKA_HOST=eureka
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - JAVA_OPTS=-Xms128m -Xmx220m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 240M

  # 8. Gateway (needs eureka + configserver)
  gateway:
    image: 2201920100047/gateway:latest
    container_name: fitness-gateway
    restart: unless-stopped
    depends_on:
      eureka:
        condition: service_healthy
      configserver:
        condition: service_healthy
      userservice:
        condition: service_healthy
      activity-service:
        condition: service_healthy
      aihelper:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - PORT=8080
      - CONFIG_HOST=configserver
      - EUREKA_HOST=eureka
      - USER_SERVICE_URL=http://userservice:8081
      - JAVA_OPTS=-Xms128m -Xmx220m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 240M

  # 9. Frontend (needs gateway)
  frontend:
    image: 2201920100047/frontend:latest
    container_name: fitness-frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 50M
